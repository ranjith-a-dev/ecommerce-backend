# === SERVER ===
server.port=${PORT:8080}

# === DATASOURCE — Aiven MySQL ===
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === HIKARI — THE CRITICAL FIX ===
# Default pool size is 10 — on free tier this means 10 SSL handshakes at startup
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
# Don't block startup waiting for connections — fail fast instead of hanging
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=60000
# Validate connections don't block startup thread
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# Aiven SSL connections drop — recycle them
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
# Keepalive to prevent Aiven from killing idle connections
spring.datasource.hikari.keepalive-time=60000

# === JPA ===
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Defer datasource initialization — don't validate schema at startup
spring.jpa.defer-datasource-initialization=true
# Open-in-view = extra DB thread held per request — kill it
spring.jpa.open-in-view=false

# === LAZY INIT — Single biggest startup speed improvement ===
spring.main.lazy-initialization=true
# But we still need the web server up for healthchecks immediately
spring.main.lazy-initialization-exclusions=\
  org.springframework.boot.autoconfigure.web.servlet.DispatcherServletAutoConfiguration,\
  org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration

# === JVM STARTUP ===
# Background verification of bytecode — don't block startup
spring.jmx.enabled=false

# === ACTUATOR — Proper health endpoint ===
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# health endpoint responds UP even if DB is slow at first
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Don't let DB health check failure = app reports DOWN
management.health.db.enabled=false

# === LOGGING — Reduce startup I/O ===
logging.level.root=WARN
logging.level.com.yourpackage=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN